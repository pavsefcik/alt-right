<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2C3550"/>
      <stop offset="0.5" stop-color="#1B2233"/>
      <stop offset="1" stop-color="#0E1219"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <g filter="url(#sh)">
    <!-- pointer -->
    <path transform="translate(224,320) scale(3.3)"
          d="M 0 0 L 0 100 L 24 77 L 40 115 L 58 107 L 42 70 L 75 70 Z"
          fill="#ffffff"/>

    <!-- the menu it opened -->
    <rect x="501" y="330" width="300" height="360" rx="48" fill="#F3F6FF"/>
    <rect x="533" y="368" width="236" height="64" rx="32" fill="#2E63F0"/>
    <rect x="557" y="388" width="140" height="24" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="533" y="476" width="200" height="24" rx="12" fill="#8E9BB8"/>
    <rect x="533" y="544" width="236" height="24" rx="12" fill="#8E9BB8" opacity="0.75"/>
    <rect x="533" y="612" width="164" height="24" rx="12" fill="#8E9BB8" opacity="0.5"/>
  </g>
</svg>
