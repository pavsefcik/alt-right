<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#8B7BFF"/>
      <stop offset="0.5" stop-color="#6047E4"/>
      <stop offset="1" stop-color="#3B22A8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1B0B5C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <!-- a menu opening into its submenu -->
  <g filter="url(#sh)" transform="translate(-14,-20)">
    <rect x="440" y="300" width="340" height="340" rx="52" fill="#ffffff" opacity="0.38"/>
    <rect x="320" y="440" width="340" height="340" rx="52" fill="#ffffff"/>
  </g>
  <g filter="url(#sh)" fill="none" stroke="#5B45E0" stroke-width="78"
     stroke-linecap="round" stroke-linejoin="round" transform="translate(-14,-20)">
    <path d="M 452 530 L 528 610 L 452 690"/>
  </g>
</svg>
