<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFC661"/>
      <stop offset="0.45" stop-color="#F79B2E"/>
      <stop offset="1" stop-color="#D2660C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#5A2600" flood-opacity="0.35"/>
    </filter>
    <mask id="cut">
      <rect x="200" y="200" width="624" height="624" fill="#000"/>
      <path d="M 292 320 H 458 L 520 404 H 736 Q 776 404 776 444 V 664 Q 776 704 736 704 H 292 Q 252 704 252 664 V 360 Q 252 320 292 320 Z" fill="#fff"/>
      <rect x="384" y="518" width="180" height="72" fill="#000"/>
      <path d="M 544 478 L 676 554 L 544 630 Z" fill="#000"/>
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <!-- solid folder silhouette with a right arrow knocked out -->
  <g filter="url(#sh)">
    <rect x="200" y="200" width="624" height="624" fill="#ffffff" mask="url(#cut)"/>
  </g>
</svg>
