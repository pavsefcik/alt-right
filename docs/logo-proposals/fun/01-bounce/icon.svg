<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6FA0FF"/>
      <stop offset="0.52" stop-color="#3D6BFF"/>
      <stop offset="1" stop-color="#1E3ECD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.08" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0A1E63" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <g transform="translate(-30,-14)">
    <g transform="rotate(-7 512 512)">
      <!-- chunky right-angle arrow, leaning into the turn -->
      <g filter="url(#sh)">
        <path d="M 392 726 V 506 A 104 104 0 0 1 496 402 H 566" fill="none"
              stroke="#ffffff" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 568 296 L 726 402 L 568 508 Z" fill="#ffffff" stroke="#ffffff"
              stroke-width="48" stroke-linejoin="round"/>
      </g>
      <!-- face -->
      <circle cx="606" cy="390" r="23" fill="#152351"/>
      <circle cx="666" cy="390" r="23" fill="#152351"/>
      <circle cx="613" cy="382" r="7" fill="#ffffff" opacity="0.95"/>
      <circle cx="673" cy="382" r="7" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>

  <!-- twinkle -->
  <path d="M 748 250 l 9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9 z" fill="#CFE4FF" opacity="0.95"/>
  <circle cx="806" cy="330" r="6" fill="#CFE4FF" opacity="0.65"/>
</svg>
