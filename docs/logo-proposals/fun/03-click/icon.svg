<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF87AC"/>
      <stop offset="0.5" stop-color="#F44E86"/>
      <stop offset="1" stop-color="#C11C58"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6B0B31" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <!-- click flash at the pointer tip -->
  <g transform="translate(475,451) scale(0.95)">
    <path d="M 0.0 -200.0 L 32.1 -77.6 L 141.4 -141.4 L 77.6 -32.1 L 200.0 -0.0 L 77.6 32.1 L 141.4 141.4 L 32.1 77.6 L 0.0 200.0 L -32.1 77.6 L -141.4 141.4 L -77.6 32.1 L -200.0 0.0 L -77.6 -32.1 L -141.4 -141.4 L -32.1 -77.6 Z" fill="#FFE27A" stroke="#FFE27A" stroke-width="26" stroke-linejoin="round"/>
  </g>

  <!-- cursor -->
  <g transform="rotate(-12 475 451)" filter="url(#sh)">
    <path transform="translate(475,451) scale(3.0)"
          d="M 0 0 L 0 100 L 24 77 L 40 115 L 58 107 L 42 70 L 75 70 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- little pop marks -->
  <circle cx="770" cy="272" r="9" fill="#FFE27A" opacity="0.9"/>
  <circle cx="222" cy="300" r="6" fill="#FFE27A" opacity="0.7"/>
</svg>
